name: V14 KOSPI index distortion

on:
  workflow_dispatch:
  pull_request:
    branches: [research/v13-leadership-concentration]
    paths:
      - index_distortion_v14.py
      - V14_INDEX_DISTORTION_METHOD.md
      - tests/test_index_distortion_v14.py
      - .github/workflows/index-distortion-v14.yml

jobs:
  v14-index-distortion:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-research.txt

      - name: Compile and run tests
        run: |
          python -m py_compile index_distortion_v14.py
          python -m unittest discover -s tests -v

      - name: Restore long-history research cache
        id: cache-long
        uses: actions/cache@v4
        with:
          path: |
            data_kospi_long
            data_kospi_amount
          key: v14-kospi-long-${{ hashFiles('research/kospi-long-results/universe.csv', 'kospi_long_history.py', 'kospi_liquidity_data.py') }}
          restore-keys: |
            v13-kospi-long-
            v12-kospi-long-
            v11-kospi-long-

      - name: Check restored research data
        id: data-ready
        shell: bash
        run: |
          if [ -f data_kospi_long/coverage.csv ] && [ -f data_kospi_long/KOSPI.csv.gz ] && [ "$(find data_kospi_amount -name '*.parquet' 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect long KOSPI price history
        if: steps.data-ready.outputs.ready != 'true'
        run: python kospi_long_history.py --phase collect --workers 16

      - name: Collect historical KRX amount data
        if: steps.data-ready.outputs.ready != 'true'
        run: python kospi_liquidity_data.py

      - name: Run V14 index-distortion research
        run: python index_distortion_v14.py

      - name: Require baseline reproduction
        run: |
          python - <<'PY'
          import pandas as pd
          x = pd.read_csv("research/v14-index-distortion-results/v14_periods.csv")
          v6 = x[(x.model == "v6_baseline") & (x.window == "all_pre2025")].iloc[0]
          v13 = x[(x.model == "v13_original") & (x.window == "all_pre2025")].iloc[0]
          assert int(v6.signals) == 1129, v6.to_dict()
          assert int(v13.signals) == 210, v13.to_dict()
          print("V6 baseline reproduced:", v6.to_dict())
          print("V13 original reproduced:", v13.to_dict())
          PY

      - name: Show V14 comparison
        if: always()
        run: |
          echo "=== PRE-2025 RANKING ==="
          cat research/v14-index-distortion-results/v14_pre2025_ranking.csv 2>/dev/null || true
          echo
          echo "=== PRACTICAL SCREEN ==="
          cat research/v14-index-distortion-results/v14_practical_screen.csv 2>/dev/null || true
          echo
          echo "=== V13 DECOMPOSITION ==="
          cat research/v14-index-distortion-results/v14_v13_decomposition.csv 2>/dev/null || true

      - name: Upload V14 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-index-distortion-results
          path: research/v14-index-distortion-results/
          if-no-files-found: warn
