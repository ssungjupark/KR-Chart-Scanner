name: Temp V15 forward patch

on:
  pull_request:
    paths:
      - ".github/workflows/_temp-v15-forward-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply targeted safety patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('paper_v15_forward.py')
          s = p.read_text()
          old = '''def update_signal_status(signals: pd.DataFrame, signal_id: str, status: str, **values) -> pd.DataFrame:\n    mask = signals["signal_id"].astype(str).eq(str(signal_id))\n    signals.loc[mask, "status"] = status\n    for k, v in values.items():\n        if k not in signals.columns:\n            signals[k] = np.nan\n        signals.loc[mask, k] = v\n    return signals\n'''
          new = '''def update_signal_status(signals: pd.DataFrame, signal_id: str, status: str, **values) -> pd.DataFrame:\n    mask = signals["signal_id"].astype(str).eq(str(signal_id))\n    signals.loc[mask, "status"] = status\n    for k, v in values.items():\n        if k not in signals.columns:\n            if isinstance(v, str):\n                signals[k] = pd.Series([None] * len(signals), index=signals.index, dtype="object")\n            else:\n                signals[k] = np.nan\n        elif isinstance(v, str) and not pd.api.types.is_object_dtype(signals[k].dtype):\n            # Empty CSV date columns are commonly inferred as float64 by pandas 3.\n            signals[k] = signals[k].astype("object")\n        signals.loc[mask, k] = v\n    return signals\n'''
          if old not in s:
              raise SystemExit('update_signal_status target not found')
          s = s.replace(old, new)
          old2 = '''        hist = stock.loc[:d, field]\n        if hist.empty:\n            raise RuntimeError(f"No mark for active position {p['ticker']} on {d.date()}")\n        stock_value += float(p["shares"]) * float(hist.iloc[-1])\n'''
          new2 = '''        if d in stock.index:\n            mark = float(stock.loc[d, field])\n        else:\n            hist = stock.loc[:d, "Close"]\n            if hist.empty:\n                raise RuntimeError(f"No mark for active position {p['ticker']} on {d.date()}")\n            # Match the historical replay: if a stock has no bar on a market day,\n            # carry its last observed close rather than its previous open.\n            mark = float(hist.iloc[-1])\n        stock_value += float(p["shares"]) * mark\n'''
          if old2 not in s:
              raise SystemExit('_portfolio_value target not found')
          p.write_text(s.replace(old2, new2))
          PY
      - name: Push patch to PR branch
        run: |
          git config user.name "v15-paper-bot"
          git config user.email "v15-paper-bot@users.noreply.github.com"
          git add paper_v15_forward.py
          if git diff --cached --quiet; then
            echo "Already patched"
          else
            git commit -m "Fix forward ledger dtype and suspended-stock marks"
            git push origin HEAD:${{ github.head_ref }}
          fi
