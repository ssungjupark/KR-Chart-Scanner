name: Full KRX validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "0 = all current KOSPI/KOSDAQ common stocks"
        required: false
        default: "0"
      workers:
        description: "Parallel data workers"
        required: false
        default: "6"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run broad KRX validation
        env:
          MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '0' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
        run: |
          python market_validation.py \
            --start 2022-01-03 \
            --end 2026-09-04 \
            --split 2025-01-02 \
            --min-adv 2000000000 \
            --min-price 1000 \
            --min-score 60 \
            --cooldown 20 \
            --sample-every 10 \
            --workers "$WORKERS" \
            --max-symbols "$MAX_SYMBOLS"

      - name: Show compact results
        if: always()
        run: |
          echo "Validation summary"
          cat output_market/market_validation_summary.csv 2>/dev/null || true
          echo
          echo "Calibrated weights"
          cat output_market/calibrated_weights.csv 2>/dev/null || true
          echo
          echo "Factor diagnostics"
          cat output_market/factor_diagnostics.csv 2>/dev/null || true

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-krx-validation-results
          path: output_market/
          if-no-files-found: warn
