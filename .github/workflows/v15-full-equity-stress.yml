name: V15 full-equity stress validation

on:
  workflow_dispatch:
  pull_request:
    branches: [research/v15-full-equity-portfolio]
    paths:
      - v15_full_equity_stress.py
      - tests/test_v15_full_equity_stress.py
      - .github/workflows/v15-full-equity-stress.yml

jobs:
  v15-full-equity-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-research.txt

      - name: Compile and run tests
        run: |
          python -m py_compile v15_full_equity_stress.py
          python -m unittest discover -s tests -v

      - name: Restore long-history research cache
        id: cache-long
        uses: actions/cache@v4
        with:
          path: |
            data_kospi_long
            data_kospi_amount
          key: v15-stress-${{ hashFiles('research/kospi-long-results/universe.csv', 'kospi_long_history.py', 'kospi_liquidity_data.py') }}
          restore-keys: |
            v15-full-equity-
            v15-kospi-long-
            v14-kospi-long-

      - name: Check restored research data
        id: data-ready
        shell: bash
        run: |
          if [ -f data_kospi_long/coverage.csv ] && [ -f data_kospi_long/KOSPI.csv.gz ] && [ "$(find data_kospi_amount -name '*.parquet' 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect long KOSPI price history
        if: steps.data-ready.outputs.ready != 'true'
        run: python kospi_long_history.py --phase collect --workers 16

      - name: Collect historical KRX amount data
        if: steps.data-ready.outputs.ready != 'true'
        run: python kospi_liquidity_data.py

      - name: Run V15 frozen full-equity stress
        run: python v15_full_equity_stress.py

      - name: Require full equity exposure and frozen 10pct sizing
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          x = pd.read_csv("research/v15-full-equity-stress-results/stress_gate.csv").iloc[0]
          assert abs(float(x.avg_total_equity_exposure) - 1.0) < 1e-9, x.to_dict()
          assert abs(float(x.signal_weight) - 0.10) < 1e-12, x.to_dict()
          m = json.load(open("research/v15-full-equity-stress-results/manifest.json"))
          assert m["signal_logic_changed"] is False
          assert m["signal_weight_changed"] is False
          print(x.to_dict())
          PY

      - name: Show stress results
        if: always()
        run: |
          echo "=== STRESS GATE ==="
          cat research/v15-full-equity-stress-results/stress_gate.csv 2>/dev/null || true
          echo
          echo "=== COST ==="
          cat research/v15-full-equity-stress-results/cost_stress.csv 2>/dev/null || true
          echo
          echo "=== WINNER REMOVAL ==="
          cat research/v15-full-equity-stress-results/winner_removal_stress.csv 2>/dev/null || true
          echo
          echo "=== INDUSTRY LEAVEOUT ==="
          cat research/v15-full-equity-stress-results/industry_leaveout_stress.csv 2>/dev/null || true
          echo
          echo "=== REUSED 2025-CURRENT ==="
          cat research/v15-full-equity-stress-results/reused_2025_current.csv 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-full-equity-stress-results
          path: research/v15-full-equity-stress-results/
          if-no-files-found: warn
