name: KRX validation v2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "0 = full current plus period-delisted KOSPI/KOSDAQ universe"
        required: false
        default: "0"
      workers:
        description: "Parallel data workers"
        required: false
        default: "6"

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run KRX validation v2
        env:
          MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '0' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
        run: |
          python market_validation_v2.py \
            --start 2022-01-03 \
            --end 2026-09-04 \
            --train-end 2023-12-28 \
            --validation-end 2024-12-30 \
            --min-adv 2000000000 \
            --min-price 1000 \
            --min-score 60 \
            --cooldown 20 \
            --sample-every 10 \
            --workers "$WORKERS" \
            --max-symbols "$MAX_SYMBOLS"
      - name: Show results
        if: always()
        run: |
          echo "Summary"
          cat output_market_v2/summary.csv 2>/dev/null || true
          echo
          echo "Selected weights"
          cat output_market_v2/selected_weights.csv 2>/dev/null || true
          echo
          echo "Model selection"
          cat output_market_v2/model_selection.csv 2>/dev/null || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-validation-v2-results
          path: output_market_v2/
          if-no-files-found: warn
