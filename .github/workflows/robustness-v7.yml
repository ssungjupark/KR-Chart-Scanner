name: Robustness diagnostics v7

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - robustness_v7.py
      - .github/workflows/robustness-v7.yml

jobs:
  robustness-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run v7 entry, exit and regime robustness diagnostics
        run: |
          python robustness_v7.py \
            --start 2022-01-03 \
            --end 2026-09-04 \
            --train-end 2023-12-28 \
            --validation-end 2024-12-30 \
            --min-adv 2000000000 \
            --min-price 1000 \
            --cooldown 20 \
            --workers 6 \
            --output-dir output_robustness_v7
      - name: Upload v7 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robustness-v7-results
          path: output_robustness_v7/
          if-no-files-found: warn
