name: Scanner smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-iljin-2026-09-04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run historical scan
        run: python main.py --ticker 103590 --as-of 2026-09-04
